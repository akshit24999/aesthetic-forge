<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded Squircle Background (iOS App Icon Style) -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="url(#primary)" stroke-width="4" stroke-opacity="0.4"/>
  
  <!-- Subtle Glow Effect -->
  <circle cx="256" cy="256" r="160" fill="url(#glow)" opacity="0.15" filter="blur(40px)"/>

  <!-- Aesthetic Dumbbell / V-Taper Emblem -->
  <g transform="translate(256,256) scale(1.1) translate(-256,-256)">
    <!-- Dumbbell Bar -->
    <rect x="156" y="244" width="200" height="24" rx="12" fill="url(#primary)"/>
    <rect x="236" y="240" width="40" height="32" rx="4" fill="#ffffff" opacity="0.9"/>
    
    <!-- Left Weight Plates -->
    <rect x="180" y="180" width="22" height="152" rx="8" fill="url(#primary)"/>
    <rect x="144" y="160" width="26" height="192" rx="10" fill="#f8fafc"/>
    <rect x="114" y="196" width="20" height="120" rx="6" fill="url(#primary)" opacity="0.8"/>
    
    <!-- Right Weight Plates -->
    <rect x="310" y="180" width="22" height="152" rx="8" fill="url(#primary)"/>
    <rect x="342" y="160" width="26" height="192" rx="10" fill="#f8fafc"/>
    <rect x="378" y="196" width="20" height="120" rx="6" fill="url(#primary)" opacity="0.8"/>

    <!-- Lightning Bolt / Energy Accent in center -->
    <path d="M256 120 L274 210 L250 210 L266 270 L238 226 L258 226 Z" fill="#38bdf8" opacity="0.9"/>
  </g>
  
  <!-- Subtle Text / Branding -->
  <text x="256" y="430" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-weight="800" font-size="34" letter-spacing="4" fill="#ffffff">AESTHETIC</text>
  <text x="256" y="460" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-weight="600" font-size="20" letter-spacing="6" fill="#38bdf8">FORGE</text>
</svg>
